name: Bug report
description: Report a reproducible problem using public or synthetic inputs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private account data or downloaded exchange datasets. Prefer Example mode."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include version, source, instrument, timeframe and strategy parameters where relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and safe logs
      description: OS, browser, Python/Node versions and request ID. Remove secrets and personal data.
